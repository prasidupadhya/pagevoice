repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npm --prefix web exec -- prettier --write
        language: system
        types_or: [javascript, jsx]
