[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pagevoice"
version = "0.1.0"
description = "Local-first book narration pipeline"
requires-python = ">=3.10,<3.14"
dependencies = ["beautifulsoup4==4.13.3", "defusedxml==0.7.1", "pysbd==0.3.4"]

[project.optional-dependencies]
xtts = ["coqui-tts==0.27.5", "torch==2.8.0", "torchaudio==2.8.0", "transformers==4.57.6"]
edge = ["edge-tts==7.2.3"]
test = ["pytest==8.3.5"]

[project.scripts]
pagevoice = "pagevoice.cli:main"

[tool.setuptools.packages.find]
include = ["pagevoice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: real offline speech and ffmpeg conversion"]
