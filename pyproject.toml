[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pagevoice"
version = "0.1.0"
description = "Local-first book narration pipeline"
requires-python = ">=3.10,<3.14"
dependencies = ["snowballstemmer==3.1.1", "beautifulsoup4==4.13.3", "defusedxml==0.7.1", "pypdf==6.19.0", "pypdfium2==5.13.0", "pillow==12.3.0", "filelock==4.0.1", "edge-tts==7.2.3"]

[project.optional-dependencies]
semantic = ["onnxruntime==1.23.2", "tokenizers==0.23.2", "numpy==2.2.6"]
edge = ["edge-tts==7.2.3"]
api = ["fastapi==0.141.1", "uvicorn==0.53.0", "python-multipart==0.0.32", "pydantic==2.13.5", "httpx==0.28.1"]
quality = ["ruff==0.16.9", "mypy==2.3.1"]
test = ["hypothesis==6.168.3", "pytest==9.0.3", "reportlab==5.0.1", "httpx==0.28.1"]

[project.scripts]
pagevoice = "pagevoice.cli:main"
pagevoice-server = "pagevoice.api:serve"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E701", "E702"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"

[tool.setuptools.packages.find]
include = ["pagevoice*", "rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: real offline speech and ffmpeg conversion"]

[tool.setuptools.package-data]
rag = ["model.json", "eval/*.json", "eval/books/*", "eval/sources/*.json"]
