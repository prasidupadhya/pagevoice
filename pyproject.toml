[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pagevoice"
version = "0.1.0"
description = "Local-first book narration pipeline"
requires-python = ">=3.10,<3.14"
dependencies = ["beautifulsoup4==4.13.3", "defusedxml==0.7.1", "pysbd==0.3.4", "pypdf==6.19.0", "pypdfium2==5.13.0", "pillow==12.3.0", "filelock==4.0.1"]

[project.optional-dependencies]
xtts = ["coqui-tts==0.27.5", "torch==2.8.0", "torchaudio==2.8.0", "transformers==4.57.6"]
edge = ["edge-tts==7.2.3"]
api = ["fastapi==0.141.1", "uvicorn==0.53.0", "python-multipart==0.0.32", "pydantic==2.13.5"]
test = ["pytest==8.3.5", "reportlab==5.0.1", "httpx==0.28.1"]

[project.scripts]
pagevoice = "pagevoice.cli:main"
pagevoice-server = "pagevoice.api:serve"

[tool.setuptools.packages.find]
include = ["pagevoice*", "rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: real offline speech and ffmpeg conversion"]
