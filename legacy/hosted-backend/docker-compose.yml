services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
      args:
        PB_VERSION: 0.40.4
    command:
      - serve
      - --http=0.0.0.0:8090
      - --origins=${PB_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - pocketbase_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  pagevoice:
    build: .
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      PAGEVOICE_HOST: 0.0.0.0
      PAGEVOICE_PORT: 8765
      PAGEVOICE_DATA: /data
      PAGEVOICE_HOSTED: "1"
      PAGEVOICE_AUTH_MODE: pocketbase
      PAGEVOICE_POCKETBASE_URL: http://pocketbase:8090
      PAGEVOICE_POCKETBASE_AUTH_COLLECTION: guests
      PAGEVOICE_MEDIA_SECRET: ${PAGEVOICE_MEDIA_SECRET:?set a unique 32+ character secret in .env}
      PAGEVOICE_ALLOWED_HOSTS: ${PAGEVOICE_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      PAGEVOICE_ALLOWED_ORIGINS: ${PAGEVOICE_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      PAGEVOICE_TRUSTED_PROXIES: ${PAGEVOICE_TRUSTED_PROXIES:-}
      PAGEVOICE_DISK_QUOTA_MB: ${PAGEVOICE_DISK_QUOTA_MB:-10240}
      PAGEVOICE_USER_QUOTA_MB: ${PAGEVOICE_USER_QUOTA_MB:-2048}
      PAGEVOICE_RATE_LIMIT: ${PAGEVOICE_RATE_LIMIT:-600}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - pagevoice_data:/data

volumes:
  pagevoice_data:
  pocketbase_data:
