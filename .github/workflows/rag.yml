name: Local retrieval regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-core.lock
      - run: python -m pip install --no-deps -e .
      - run: pagevoice rag-eval --baseline rag/eval/after.json
      - run: python -m pytest -q tests/test_rag_overhaul.py -k 'not analysis_features_api and not background_snapshot'
